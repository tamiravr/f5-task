services:
  backend:
    build:
      context: ./backend
    # Published for local debugging: curl http://localhost:8080/health
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  proxy:
    build:
      context: ./proxy
    # Published for local debugging: curl http://localhost:8081/nginx-health
    ports:
      - "8081:80"
    depends_on:
      - backend
        # Verify that Nginx can successfully forward requests to the backend.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api/info"]
      interval: 2s
      timeout: 2s
      retries: 15

  test-runner:
    build:
      context: ./test-runner
  # Wait until the proxy and backend are ready before running tests.
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      - PROXY_URL=http://proxy:80
